apiVersion: apps/v1
kind: Deployment
metadata:
  name: medsight-backend
  namespace: medsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medsight-backend
  template:
    metadata:
      labels:
        app: medsight-backend
    spec:
      containers:
        - name: medsight-backend
          image: medsight-ai:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: PNEUMOSCAN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medsight-secrets
                  key: PNEUMOSCAN_SECRET_KEY
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: medsight-mail-secrets
                  key: GMAIL_USER
            - name: GMAIL_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medsight-mail-secrets
                  key: GMAIL_APP_PASSWORD
            - name: FRONTEND_URL
              value: "http://localhost:8000"
          volumeMounts:
            - name: data
              mountPath: /app/backend/pneumoscan/storage
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: medsight-data
       

